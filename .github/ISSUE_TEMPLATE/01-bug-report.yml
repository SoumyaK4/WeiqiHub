name: "🐛 Bug report"
description: "Report a reproducible problem in SWHub"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include enough detail to reproduce it.
        **Do not include passwords etc.**

  - type: input
    id: version
    attributes:
      label: SWHub version
      description: "Which release/build are you using?"
      placeholder: "e.g. SWHub-v0.2.6"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Android
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area of the app
      options:
        - Startup / install / update
        - Local board / SGF tools
        - Train / tsumego / joseki / SRS
        - KataGo analysis
        - Pattern Search
        - Online play / server connection
        - Teaching rooms / voice / chat
        - Player stats / sync
        - UI / navigation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: "Describe the problem and what you were doing when it occurred."
      placeholder: "A clear description of the bug."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Go to ...
        3. Tap/click ...
        4. See ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error text
      description: "Paste relevant logs or error messages. Remove passwords, tokens, usernames, or other sensitive data first."
      render: text

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, video, SGF, or other files
      description: "Drag files into this box if they help reproduce or explain the problem."

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: "I searched existing issues for the same problem."
          required: true
        - label: "I removed passwords etc. from anything I pasted or attached."
          required: true
